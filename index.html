<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Cartão × Pix</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:18px}.hero{background:#111827;color:#fff;border-radius:24px;padding:24px 22px;margin-bottom:14px}
h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:#cbd2dc;line-height:1.4}.card,.metrics{background:#fff;border-radius:20px;padding:20px;margin:13px 0;box-shadow:0 4px 18px #0001}
label{display:block;font-weight:800;font-size:14px;margin:4px 0 7px}input{width:100%;height:58px;border:1px solid #d5dbe3;border-radius:13px;padding:0 15px;font-size:19px}
button{width:100%;height:58px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:18px;font-weight:900;margin-top:16px}
.decision{border-radius:18px;padding:20px;text-align:center;margin-top:14px}.decision h2{margin:0 0 7px;font-size:25px}.decision p{margin:0;line-height:1.45}
.cardwin{background:#eaf4ff;color:#075ea8;border:2px solid #1478d4}.pixwin{background:#e9f8f1;color:#087a4f;border:2px solid #11a36a}.tie{background:#f1f3f5;color:#4b5563}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e6e9ed;font-size:14px}.row:last-child{border:0}.row strong{text-align:right}
.title{font-size:13px;font-weight:900;color:#5d6875;text-transform:uppercase}.best{background:#f7f8fa;border-radius:12px;padding:13px;margin-top:12px;line-height:1.45}
.note{font-size:11px;color:#7b8794;text-align:center;line-height:1.4;margin:15px}
</style>
</head>
<body><main class="app">
<section class="hero"><h1>💳 Cartão × Pix</h1><p>Informe apenas os dois preços. O app escolhe automaticamente o melhor cenário.</p></section>
<section class="card">
<label>Valor no crédito</label><input id="credit" inputmode="decimal" type="number" step="0.01" placeholder="Ex.: 17280">
<label style="margin-top:18px">Valor no Pix</label><input id="pix" inputmode="decimal" type="number" step="0.01" placeholder="Ex.: 16900">
<button id="decide">GERAR DECISÃO</button>
</section>
<div id="result"></div>
<div class="note">Premissas: Elo Nanquim 2,0 pts/US$; Itaú Black 1,8 pts/US$; bônus 120%; dólar R$ 5,40; Azul R$13, Smiles R$16 e LATAM Pass R$26 por 1.000. Ajuste no arquivo JS quando quiser atualizar.</div>
</main>
<script>
const C=[
["BB Elo Nanquim",2,"Livelo","Azul",13],["BB Elo Nanquim",2,"Livelo","Smiles",16],["BB Elo Nanquim",2,"Livelo","LATAM Pass",26],
["Itaú Mastercard Black",1.8,"Pontos Itaú","Azul",13],["Itaú Mastercard Black",1.8,"Pontos Itaú","Smiles",16],["Itaú Mastercard Black",1.8,"Pontos Itaú","LATAM Pass",26]];
const USD=5.4,BONUS=1.2;
const money=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
document.getElementById("decide").onclick=()=>{
 const credit=+document.getElementById("credit").value||0,pix=+document.getElementById("pix").value||0,r=document.getElementById("result");
 if(!credit||!pix){r.innerHTML='<div class="decision tie"><h2>Preencha os dois valores</h2><p>Informe o crédito e o Pix.</p></div>';return}
 const saving=credit-pix;
 const a=C.map(s=>{const pts=credit/USD*s[1],m=pts*(1+BONUS),v=m/1000*s[4];return{s,pts,m,v,adv:v-saving}}).sort((a,b)=>b.adv-a.adv);
 const b=a[0], card=b.adv>0, cls=card?"cardwin":b.adv<0?"pixwin":"tie";
 const title=card?"💳 PAGUE NO CARTÃO":b.adv<0?"⚡ PAGUE NO PIX":"⚖️ EMPATE TÉCNICO";
 const text=card?`Melhor combinação: <b>${b.s[0]}</b> → ${b.s[2]} → <b>${b.s[3]}</b>. O benefício estimado supera o desconto do Pix em <b>${money(b.adv)}</b>.`:`O desconto do Pix ${b.adv<0?"supera":"é equivalente ao"} benefício estimado das milhas.`;
 const ranking=a.map((x,i)=>`<div class="row"><span>${i+1}. ${x.s[0]}<br>${x.s[3]}</span><strong>${money(x.v)}</strong></div>`).join("");
 r.innerHTML=`<div class="decision ${cls}"><h2>${title}</h2><p>${text}</p></div>
 <div class="metrics"><div class="title">Resultado</div>
 <div class="row"><span>Crédito</span><strong>${money(credit)}</strong></div>
 <div class="row"><span>Pix</span><strong>${money(pix)}</strong></div>
 <div class="row"><span>Economia do Pix</span><strong>${money(saving)} (${(saving/credit*100).toFixed(2)}%)</strong></div>
 <div class="row"><span>Melhor cartão</span><strong>${b.s[0]}</strong></div>
 <div class="row"><span>Melhor programa</span><strong>${b.s[3]}</strong></div>
 <div class="row"><span>Pontos</span><strong>${Math.round(b.pts).toLocaleString("pt-BR")}</strong></div>
 <div class="row"><span>Milhas c/ bônus</span><strong>${Math.round(b.m).toLocaleString("pt-BR")}</strong></div>
 <div class="row"><span>Valor estimado</span><strong>${money(b.v)}</strong></div>
 <div class="best"><b>🎯 Decisão final:</b> ${card?"Use o cartão e siga a melhor combinação acima.":"Pague no Pix."}</div></div>
 <div class="metrics"><div class="title">Ranking automático</div>${ranking}</div>`;
};
</script>
<script>
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
